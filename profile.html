<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Profile — Brew &amp; Blue</title>
<meta name="description" content="Manage your account details, saved address, password and preferences.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/pages.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2314507E'/><path d='M28 32h38v26a19 19 0 0 1-38 0z' fill='%23F5B301'/></svg>">
</head>
<body data-page="profile">

<header id="site-header"></header>

<main>
  <section class="page-hero" style="padding-block:2.2rem">
    <div class="wrap">
      <nav class="crumbs"><a href="index.html">Home</a> <span>/</span> <span>My profile</span></nav>
      <h1>My profile</h1>
      <p>Your details, saved for faster checkout.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap acct-layout">
      <aside class="panel side-nav" id="sideNav"></aside>
      <div id="profileRoot"></div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {

  let user = Auth.require();
  if (!user) return;

  $('#sideNav').innerHTML =
    '<a href="orders.html">' + icon('box') + 'My orders</a>' +
    '<a href="profile.html" class="active">' + icon('user') + 'My profile</a>' +
    '<a href="cart.html">' + icon('cart') + 'My cart</a>' +
    '<a href="feedback.html">' + icon('message') + 'Feedback</a>' +
    (user.role === 'admin' ? '<a href="admin.html">' + icon('grid') + 'Admin dashboard</a>' : '');

  function myOrders() {
    return Orders.all().filter(o => o.userId === user.id || (o.userEmail || '').toLowerCase() === user.email);
  }

  function render() {
    const orders = myOrders();
    const spent = orders.filter(o => o.status !== 'cancelled').reduce((s, o) => s + o.total, 0);
    const points = user.points || 0;
    const toNext = 100 - (points % 100);
    const favs = Favs.list().map(id => Products.find(id)).filter(Boolean);

    $('#profileRoot').innerHTML = `
    <!-- ===== header card ===== -->
    <div class="profile-head">
      <span class="avatar">${esc(initials(user.name))}</span>
      <div>
        <h2>${esc(user.name)}</h2>
        <p>${esc(user.email)} · Member since ${fmtDate(user.joined)}</p>
        <span class="badge ${user.role === 'admin' ? 'badge-new' : 'badge-info'}" style="margin-top:.5rem">
          ${user.role === 'admin' ? 'Administrator' : 'Member'}</span>
      </div>
      <div class="loyalty">
        <b>${points}</b><span>loyalty points</span>
        <div class="bar"><i style="width:${Math.min(100, points % 100)}%"></i></div>
        <span style="font-size:.7rem">${toNext} points to your next $5</span>
      </div>
    </div>

    <!-- ===== stats ===== -->
    <div class="grid g-3" style="margin-bottom:1.6rem">
      <div class="card card-pad">
        <div class="ico ico-blue" style="width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:.7rem">${icon('box')}</div>
        <b style="font-family:var(--font-head);font-size:1.7rem">${orders.length}</b>
        <p class="small muted">Orders placed</p>
      </div>
      <div class="card card-pad">
        <div class="ico ico-brown" style="width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:.7rem">${icon('dollar')}</div>
        <b style="font-family:var(--font-head);font-size:1.7rem">${money(spent)}</b>
        <p class="small muted">Spent with us</p>
      </div>
      <div class="card card-pad">
        <div class="ico ico-yellow" style="width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:.7rem">${icon('heart')}</div>
        <b style="font-family:var(--font-head);font-size:1.7rem">${favs.length}</b>
        <p class="small muted">Saved favourites</p>
      </div>
    </div>

    <!-- ===== personal details ===== -->
    <div class="panel" style="margin-bottom:1.6rem">
      <div class="panel-head"><h3>Personal details</h3><span class="small muted">Used to fill checkout</span></div>
      <div class="panel-body">
        <div id="infoAlert"></div>
        <form id="infoForm" novalidate>
          <div class="form-row">
            <div class="field"><label for="pName">Full name</label>
              <input id="pName" value="${esc(user.name)}" required>
              <span class="err-msg">Please enter your name.</span></div>
            <div class="field"><label for="pPhone">Phone</label>
              <input id="pPhone" type="tel" value="${esc(user.phone || '')}">
              <span class="err-msg">Enter at least 8 digits.</span></div>
          </div>
          <div class="field"><label for="pEmail">Email</label>
            <input id="pEmail" type="email" value="${esc(user.email)}" required>
            <span class="err-msg">Enter a valid email address.</span></div>
          <div class="form-row">
            <div class="field"><label for="pAddr">Default delivery address</label>
              <input id="pAddr" value="${esc(user.address || '')}" placeholder="45 Street 240, Daun Penh"></div>
            <div class="field"><label for="pCity">City / district</label>
              <input id="pCity" value="${esc(user.city || '')}" placeholder="Phnom Penh"></div>
          </div>
          <div class="field"><label for="pNotes">Standing note for the barista</label>
            <textarea id="pNotes" style="min-height:80px" placeholder="Oat milk, no sugar…">${esc(user.notes || '')}</textarea>
            <span class="hint">We attach this to every order you place.</span></div>
          <div style="display:flex;gap:.7rem;flex-wrap:wrap">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <button type="button" class="btn btn-light" id="resetInfo">Undo</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ===== password ===== -->
    <div class="panel" style="margin-bottom:1.6rem">
      <div class="panel-head"><h3>Password</h3><span class="small muted">Last changed at sign-up</span></div>
      <div class="panel-body">
        <div id="pwAlert"></div>
        <form id="pwForm" novalidate>
          <div class="field"><label for="curPw">Current password</label>
            <input id="curPw" type="password" autocomplete="current-password">
            <span class="err-msg">Enter your current password.</span></div>
          <div class="form-row">
            <div class="field"><label for="newPw">New password</label>
              <input id="newPw" type="password" autocomplete="new-password">
              <span class="err-msg">At least 6 characters.</span></div>
            <div class="field"><label for="newPw2">Confirm new password</label>
              <input id="newPw2" type="password" autocomplete="new-password">
              <span class="err-msg">The passwords do not match.</span></div>
          </div>
          <button type="submit" class="btn btn-brown">Update password</button>
        </form>
      </div>
    </div>

    <!-- ===== preferences ===== -->
    <div class="panel" style="margin-bottom:1.6rem">
      <div class="panel-head"><h3>Preferences</h3></div>
      <div class="panel-body">
        <label class="check" style="margin-bottom:1rem">
          <input type="checkbox" id="prefNews" ${user.newsletter ? 'checked' : ''}>
          <span><b>Email me offers and new roasts</b><br><small class="muted">Roughly twice a month, never more.</small></span></label>
        <label class="check">
          <input type="checkbox" id="prefSms">
          <span><b>SMS when my delivery is close</b><br><small class="muted">Only for orders in progress.</small></span></label>
      </div>
    </div>

    <!-- ===== favourites ===== -->
    <div class="panel" style="margin-bottom:1.6rem">
      <div class="panel-head"><h3>Saved favourites</h3><a href="menu.html" class="btn btn-light btn-sm">Browse menu</a></div>
      <div class="panel-body">
        ${favs.length
          ? '<div class="product-grid" id="favGrid">' + favs.map(productCard).join('') + '</div>'
          : '<p class="muted small">Nothing saved yet — tap the heart on any product to keep it here.</p>'}
      </div>
    </div>

    <!-- ===== account ===== -->
    <div class="panel">
      <div class="panel-head"><h3>Account</h3></div>
      <div class="panel-body">
        <div class="between">
          <div><b>Sign out of this device</b><p class="small muted">You will need your password to sign back in.</p></div>
          <button class="btn btn-light" id="signoutBtn2">Sign out</button>
        </div>
        <hr style="border:0;border-top:1px solid var(--line);margin:1.2rem 0">
        <div class="between">
          <div><b style="color:var(--danger)">Delete my account</b>
            <p class="small muted">Removes your profile and order history from this browser. Cannot be undone.</p></div>
          <button class="btn btn-danger" id="deleteBtn">Delete account</button>
        </div>
      </div>
    </div>`;

    bind();
  }

  function bind() {
    const setErr = (id, bad) => { $('#' + id).closest('.field').classList.toggle('err', bad); return !bad; };

    /* ----- details ----- */
    $('#infoForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = $('#pName').value.trim();
      const email = $('#pEmail').value.trim();
      const phone = $('#pPhone').value.trim();

      let ok = true;
      ok = setErr('pName', name.length < 2) && ok;
      ok = setErr('pEmail', !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) && ok;
      ok = setErr('pPhone', phone !== '' && phone.replace(/\D/g, '').length < 8) && ok;
      if (!ok) { toast('Please fix the highlighted fields', 'err'); return; }

      const res = Auth.update({
        name, email, phone,
        address: $('#pAddr').value.trim(),
        city: $('#pCity').value.trim(),
        notes: $('#pNotes').value.trim()
      });

      if (!res.ok) {
        $('#infoAlert').innerHTML = '<div class="alert alert-err">' + icon('alert') + '<span>' + esc(res.error) + '</span></div>';
        return;
      }
      user = res.user;
      $('#infoAlert').innerHTML = '<div class="alert alert-ok">' + icon('checkCircle') + '<span>Your details were saved.</span></div>';
      toast('Profile updated', 'ok');
      renderHeader();
      setTimeout(render, 900);
    });

    $('#resetInfo').addEventListener('click', render);

    /* ----- password ----- */
    $('#pwForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const cur = $('#curPw').value, nw = $('#newPw').value, nw2 = $('#newPw2').value;

      let ok = true;
      ok = setErr('curPw', !cur) && ok;
      ok = setErr('newPw', nw.length < 6) && ok;
      ok = setErr('newPw2', nw !== nw2 || !nw2) && ok;
      if (!ok) return;

      const res = Auth.changePassword(cur, nw);
      if (!res.ok) {
        $('#pwAlert').innerHTML = '<div class="alert alert-err">' + icon('alert') + '<span>' + esc(res.error) + '</span></div>';
        $('#curPw').closest('.field').classList.add('err');
        return;
      }
      user = Auth.current();
      $('#pwAlert').innerHTML = '<div class="alert alert-ok">' + icon('checkCircle') + '<span>Password updated.</span></div>';
      $('#pwForm').reset();
      toast('Password changed', 'ok');
    });

    /* ----- preferences ----- */
    $('#prefNews').addEventListener('change', (e) => {
      Auth.update({ newsletter: e.target.checked });
      user = Auth.current();
      toast(e.target.checked ? 'Subscribed to offers' : 'Unsubscribed from offers');
    });
    $('#prefSms').addEventListener('change', (e) =>
      toast(e.target.checked ? 'SMS alerts on' : 'SMS alerts off'));

    /* ----- favourites ----- */
    const fg = $('#favGrid');
    if (fg) {
      bindCardActions(fg);
      $$('[data-fav]', fg).forEach(b => b.addEventListener('click', () => setTimeout(render, 350)));
    }

    /* ----- account ----- */
    $('#signoutBtn2').addEventListener('click', () => {
      Auth.signout();
      toast('Signed out', 'ok');
      setTimeout(() => location.href = 'index.html', 600);
    });

    $('#deleteBtn').addEventListener('click', () => {
      if (!confirm('Delete your account and order history? This cannot be undone.')) return;
      if (!confirm('Really delete? Type OK on the next prompt to confirm.')) return;
      const users = Auth.users().filter(u => u.id !== user.id);
      DB.set('bb_users', users);
      DB.set('bb_orders', Orders.all().filter(o => o.userId !== user.id));
      Auth.signout();
      toast('Account deleted');
      setTimeout(() => location.href = 'index.html', 800);
    });
  }

  render();
});
</script>
</body>
</html>
